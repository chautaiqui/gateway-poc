apiVersion: v1
kind: Namespace
metadata:
  name: gateway-bench
  labels: {app.kubernetes.io/part-of: gateway-benchmark}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: gateway-bench
spec:
  replicas: 4
  selector:
    matchLabels: {app: bench-echo}
  template:
    metadata:
      labels: {app: bench-echo}
    spec:
      containers:
      - name: echo
        image: traefik/whoami:v1.11.0
        ports: [{containerPort: 80, name: http}]
        readinessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests: {cpu: 250m, memory: 64Mi}
          limits: {cpu: '2', memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: gateway-bench
spec:
  selector: {app: bench-echo}
  ports: [{name: http, port: 80, targetPort: 80}]
