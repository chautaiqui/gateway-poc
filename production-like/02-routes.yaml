apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envoy-bench
  namespace: gateway-bench
spec:
  parentRefs:
  - name: envoy-bench
    sectionName: https
  hostnames: [bench.dev.local]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: echo
      port: 80
    timeouts:
      request: 5s
      backendRequest: 4s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-bench
  namespace: gateway-bench
spec:
  parentRefs:
  - name: traefik-bench
    sectionName: https
  hostnames: [bench.dev.local]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: echo
      port: 80
    # Gateway API timeouts are controller/version dependent. Verify status.
    timeouts:
      request: 5s
      backendRequest: 4s
