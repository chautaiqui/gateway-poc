# Local limit = per Envoy replica; not shared across replicas.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy-bench-policies
  namespace: gateway-bench
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: envoy-bench
  rateLimit:
    local:
      rules:
      - limit: {requests: 10000, unit: Second}
  retry:
    numRetries: 2
    perRetry:
      backOff: {baseInterval: 50ms, maxInterval: 200ms}
      timeout: 1s
    retryOn:
      triggers: [connect-failure, retriable-status-codes]
      httpStatusCodes: [503]
