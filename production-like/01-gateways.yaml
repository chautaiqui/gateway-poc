# Envoy uses EXISTING GatewayClass envoy-dev; do not install a second Envoy controller.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-bench
  namespace: gateway-bench
spec:
  gatewayClassName: envoy-dev
  listeners:
  - name: https
    hostname: bench.dev.local
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs: [{kind: Secret, name: bench-tls}]
    allowedRoutes:
      namespaces: {from: Same}
  # Plain-HTTP listener for throughput benchmarking (no TLS handshake variance).
  - name: http
    hostname: bench.dev.local
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces: {from: Same}
---
# Uses GatewayClass already defined by existing base/gateway.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-bench
  namespace: gateway-bench
spec:
  gatewayClassName: traefik-poc
  listeners:
  - name: https
    hostname: bench.dev.local
    protocol: HTTPS
    port: 8443 # Must match Traefik websecure entrypoint .port; Service exposes 443.
    tls:
      mode: Terminate
      certificateRefs: [{kind: Secret, name: bench-tls}]
    allowedRoutes:
      namespaces: {from: Same}
  # Plain-HTTP listener on the Traefik web entrypoint internal port 8000 (Service exposes 80).
  - name: http
    hostname: bench.dev.local
    protocol: HTTP
    port: 8000
    allowedRoutes:
      namespaces: {from: Same}
